<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>الواقع اونلاين</title>
    <link rel="shortcut icon" href="./imgweb/icon.svg" type="image/png">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0; 
            overflow: hidden; 
        }

        .content-wrapper {
            text-align: right;
            background-color: #fff; 
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); 
            max-width: 800px; 
            min-width: 500px;
            width: 100%;
            box-sizing: border-box;
            margin-top: -20px; 
            display: flex;
            flex-direction: column;
            align-items: normal;
            direction: rtl;
        }

        .article-content {
            display: block; 
        }

        .news-cards {
            display: none; 
        }

        #title-banner, #publish-banner {
            display: none; 
        }

        header {
            background-color: #fff;
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo {
            margin-right: 20px;
            height: 100%; 
            display: flex;
            align-items: center;
        }     
        .logo img {
            max-height: 200px; 
            width: auto; 
        }
        .navigation {
            display: flex;
            justify-content: center;
        }
        .navigation a {
            display: flex;
            align-items: center; 
            color: #000;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 500;
            padding: 10px;
            margin: 0px 10px;
            transition: all 0.3s ease; 
        }
        .navigation a img {
            max-height: 100px;
            width: auto;
            margin-right: 5px; 
        }
        .navigation a:hover {
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: none; 
        }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="imgweb/logo.svg"></a>    
        <div class="menu-toggle" id="menu-toggle">
            <i class="fa-solid fa-bars"></i>
        </div>    
        <nav class="navigation" id="nav-menu">
          <a href="index.html#about"><img src="imgweb/من نحن.svg"></a>
          <a href="index.html#pub"><img src="imgweb/اعلانات.png"></a>
          <a href="index.html#news"><img src="imgweb/الاخبار.svg"></a>
        </nav>
    </header>

<div class="content-wrapper">
    <section class="news-cards" id="news">
        <!-- لا تحتوي على أي بطاقات حالياً -->
    </section>

    <div id="article-content" class="article-content">
        <!-- هنا سيتم تحديث محتوى المقال -->
    </div>
</div>

<script src="slide.js"></script>

<script>
window.onload = function() {
    const articleContent = document.getElementById('article-content');
    const urlParams = new URLSearchParams(window.location.search);
    const articleUrl = urlParams.get('url');

    const xhr = new XMLHttpRequest();
    xhr.open('GET', decodeURIComponent(articleUrl), true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            articleContent.innerHTML = xhr.responseText;
            document.querySelector('.news-cards').style.display = 'none';
            document.getElementById('title-banner').style.display = 'none';
            document.getElementById('publish-banner').style.display = 'none';
        }
    };
    xhr.send();
};
</script>

</body>
</html>
